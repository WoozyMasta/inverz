site_name: Inverz
site_description: >-
  Compact, deterministic indexes for resolving DayZ IDs
  and BattlEye GUIDs to SteamID64 with exact hash verification.
repo_name: WoozyMasta/inverz
repo_url: https://github.com/WoozyMasta/inverz
edit_uri: edit/master/

copyright: Copyright &copy; 2026 WoozyMasta

extra:
  generator: false

theme:
  name: material
  logo: logo.svg
  favicon: logo.svg
  features:
    - content.code.copy
    - content.tabs.link
    - toc.integrate
    - navigation.top
    - navigation.indexes
    - navigation.path
    - navigation.sections
    - navigation.expand
    - navigation.footer
    - search.highlight
    - search.suggest

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

  font:
    text: Roboto
    code: JetBrains Mono

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search
  - minify

extra_css:
  - mkdocs.css

nav:
  - Home: README.md
  - CLI: CLI.md
  - Core API: https://pkg.go.dev/github.com/woozymasta/inverz
  - OCI Registry API: https://pkg.go.dev/github.com/woozymasta/inverz/oci
  - Release notes: CHANGELOG.md
